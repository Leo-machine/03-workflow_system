services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow}
      POSTGRES_DB: ${POSTGRES_DB:-flowmap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 宿主机端口可配，避免与本机其他系统的 Postgres 冲突；容器内仍是 5432
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flow} -d ${POSTGRES_DB:-flowmap}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flow}:${POSTGRES_PASSWORD:-flow}@postgres:5432/${POSTGRES_DB:-flowmap}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      VIEWER_USERNAME: ${VIEWER_USERNAME:-viewer}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-viewer123}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8081},http://localhost:${VITE_DEV_PORT:-5174}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  pgdata:
  uploads:
